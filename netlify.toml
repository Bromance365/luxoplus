# Only the public app is deployed. SQL, QA and developer files stay private.
[build]
  base = "queue"
  command = "node build.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-cache"

[[redirects]]
  from = "/tv"
  to = "/tv.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
