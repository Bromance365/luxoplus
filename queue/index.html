<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020610">
<title>LUX·O·PLUS — File d'attente</title>
<meta name="description" content="Prenez votre place dans la file du lave-auto Luxoplus et suivez votre tour en direct.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
  .page { max-width: 560px; margin: 0 auto; padding: 18px 16px 32px; }

  /* En-tête */
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .lang { display: flex; border: 1px solid var(--hairline-strong); border-radius: 100px; overflow: hidden; }
  .lang button { background: none; border: none; padding: 7px 10px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; color: var(--mute); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: rgba(74,158,255,0.18); color: var(--ivory); }

  /* Bandeau d'état */
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 22px; }
  .strip > div { padding: 14px 12px 13px; min-width: 0; }
  .strip .label { letter-spacing: 0.14em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip > div + div { border-left: 1px solid var(--hairline); }
  .strip-val { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip-val.glow { color: var(--blue-glow); text-shadow: 0 0 18px rgba(74,158,255,0.45); font-style: italic; }

  /* Introduction */
  .hero { margin: 6px 0 22px; }
  .hero h1 { font-size: clamp(40px, 11vw, 54px); margin: 10px 0 12px; }
  .hero p { font-size: 16px; line-height: 1.5; }

  .step { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
  .step .label { color: var(--blue-glow); }
  .step h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }

  /* Forfaits */
  .pkgs { display: grid; gap: 14px; }
  .pkg { position: relative; display: block; cursor: pointer; padding: 18px 18px 16px; border-radius: var(--r-md); transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
  .pkg input { position: absolute; opacity: 0; pointer-events: none; }
  .pkg:hover { border-color: rgba(74,158,255,0.35); }
  .pkg.selected { border-color: var(--blue-bright); background: linear-gradient(160deg, rgba(21,101,192,0.55), rgba(13,40,84,0.55)); box-shadow: 0 20px 50px rgba(13,71,161,0.35), 0 0 40px rgba(74,158,255,0.15); }
  .pkg.disabled { opacity: 0.45; cursor: not-allowed; }
  .pkg:has(input:focus-visible) { outline: 2px solid var(--blue-glow); outline-offset: 2px; }
  .pkg-row { display: flex; align-items: flex-start; gap: 12px; }
  .pkg-name { font-size: 26px; font-weight: 800; font-style: italic; letter-spacing: -0.03em; line-height: 1; }
  .pkg-tag { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--chrome); margin-top: 6px; }
  .pkg.selected .pkg-tag { color: var(--blue-pale); }
  .pkg-price { margin-left: auto; text-align: right; flex-shrink: 0; }
  .price { font-size: 30px; font-weight: 800; font-style: italic; color: var(--blue-glow); letter-spacing: -0.03em; line-height: 1; text-shadow: 0 0 22px rgba(74,158,255,0.3); white-space: nowrap; }
  .price small { font-size: 15px; }
  .pkg.selected .price { color: #fff; text-shadow: 0 0 22px rgba(255,255,255,0.35); }
  .pkg-time { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mute); margin-top: 8px; }
  .pkg.selected .pkg-time { color: var(--blue-pale); }
  .badge { position: absolute; top: -10px; right: 16px; background: var(--ivory); color: var(--blue); font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; padding: 5px 11px; border-radius: 100px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
  .badge.late { background: #2a2210; color: var(--warn); box-shadow: none; border: 1px solid rgba(255,201,77,0.3); }
  .includes { list-style: none; margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.18); display: grid; gap: 7px; }
  .includes li { display: flex; gap: 10px; font-size: 13.5px; color: #fff; align-items: flex-start; }
  .includes li::before { content: ""; width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; border-radius: 50%; background: rgba(255,255,255,0.22) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1.5 5l2.5 2.5L8.5 2.5' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") center no-repeat; }

  /* Tailles */
  .sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .size { position: relative; cursor: pointer; text-align: center; padding: 12px 6px; border-radius: var(--r-sm); border: 1px solid var(--hairline-strong); background: rgba(255,255,255,0.025); transition: all 0.15s; }
  .size input { position: absolute; opacity: 0; pointer-events: none; }
  .size strong { display: block; font-size: 15px; font-weight: 700; }
  .size span { display: block; font-size: 11px; color: var(--mute); margin-top: 2px; }
  .size.selected { border-color: var(--blue-bright); background: rgba(30,136,229,0.18); box-shadow: 0 0 22px rgba(74,158,255,0.2); }
  .size:has(input:focus-visible) { outline: 2px solid var(--blue-glow); outline-offset: 2px; }

  /* Résumé */
  .summary { padding: 18px; margin: 24px 0 14px; }
  .summary-total { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .summary-total .price { font-size: 38px; }
  .summary-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .summary-meta strong { display: block; font-size: 15px; margin-top: 4px; }
  .summary-meta .label { letter-spacing: 0.1em; }
  .summary-meta small { display: block; font-size: 12px; color: var(--mute); margin-top: 2px; }
  .plus-tax { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); text-align: right; margin-top: 6px; }
  .recap { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 12px 0 0; font-size: 14px; }
  .recap dt { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); padding-top: 3px; }
  .recap dd { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .sum-pricing { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .from { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); display: block; text-align: right; margin-bottom: 4px; }
  .missing { margin-top: 12px; }
  .find-box { margin-bottom: 18px; border-radius: var(--r-md); }
  .find-toggle { width: 100%; background: none; border: none; cursor: pointer; color: var(--blue-pale); font-weight: 600; font-size: 14.5px; padding: 15px 18px; display: flex; justify-content: space-between; align-items: center; }
  #find-form { padding: 0 18px 18px; }
  #find-form p { font-size: 13.5px; margin-bottom: 14px; }
  .updated { text-align: center; font-size: 12px; color: var(--mute); margin-top: 10px; }
  .link-btn { background: none; border: none; color: var(--blue-glow); cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; }
  .save-link { padding: 16px 18px; margin-bottom: 12px; border-radius: var(--r-md); }
  .save-link p { font-size: 13.5px; color: var(--chrome); margin: 6px 0 12px; line-height: 1.5; }
  .save-link .btn { padding: 11px 18px; font-size: 14px; }
  .time-card { margin: 18px 0 6px; padding: 16px; border-radius: var(--r-md); background: rgba(74,158,255,0.1); border: 1px solid rgba(74,158,255,0.3); text-align: center; }
  .time-card .big { font-size: 34px; font-weight: 800; font-style: italic; letter-spacing: -0.03em; color: var(--blue-glow); text-shadow: 0 0 20px rgba(74,158,255,0.35); line-height: 1.1; margin: 6px 0 8px; }
  .time-card p { font-size: 13.5px; color: var(--chrome); line-height: 1.5; }
  .time-card p strong { color: var(--ivory); }
  .pay-note { font-size: 12.5px; margin-top: 12px; text-align: center; }

  /* Billet */
  .ticket { overflow: hidden; margin-bottom: 14px; }
  .ticket-top { text-align: center; padding: 26px 20px 22px; background: linear-gradient(180deg, rgba(21,101,192,0.45), rgba(13,40,84,0.2)); border-bottom: 1px dashed rgba(255,255,255,0.18); }
  .ticket-num { font-size: 96px; font-weight: 800; font-style: italic; letter-spacing: -0.05em; line-height: 1; margin: 6px 0 4px; padding-right: 0.08em;
    background: linear-gradient(180deg, #fff, #b8ddff 55%, #4a9eff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 24px rgba(74,158,255,0.45)); }
  .ticket-name { font-family: var(--serif); font-style: italic; color: var(--blue-pale); font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; }
  .chip { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; padding: 5px 11px; border-radius: 100px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); white-space: nowrap; }
  .ticket-body { padding: 6px 20px 18px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--hairline); }
  .row:last-child { border-bottom: none; }
  .row-val { font-weight: 700; text-align: right; }
  .row-val.big { font-size: 20px; font-style: italic; color: var(--blue-glow); }
  .progress { margin: 16px 0 4px; }
  .bar { height: 6px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #1565c0, #4a9eff); box-shadow: 0 0 12px rgba(74,158,255,0.6); border-radius: 3px; transition: width 0.6s ease; }
  .bar-labels { display: flex; justify-content: space-between; margin-top: 7px; }
  .notif-prompt { display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--blue-pale); }
  .notif-prompt .btn { padding: 9px 16px; font-size: 13px; flex-shrink: 0; }

  /* Écrans de fin */
  .big-card { text-align: center; padding: 36px 22px 30px; margin-bottom: 14px; animation: pop 0.45s cubic-bezier(0.175,0.885,0.32,1.275); }
  @keyframes pop { from { transform: scale(0.93); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .big-card h1 { font-size: 40px; margin: 12px 0 10px; }
  .big-card p { font-size: 15.5px; line-height: 1.55; }
  .bay { display: inline-block; margin-top: 18px; padding: 14px 26px; border-radius: var(--r-md); background: linear-gradient(135deg, #1e88e5, #1565c0); box-shadow: 0 12px 32px rgba(30,136,229,0.4); }
  .bay .label { color: var(--blue-pale); }
  .bay strong { display: block; font-size: 40px; font-weight: 800; font-style: italic; line-height: 1.05; }
  .turn-card { border-color: rgba(74,158,255,0.5); box-shadow: 0 0 60px rgba(74,158,255,0.2); }

  .footer { text-align: center; margin-top: 30px; font-size: 12.5px; color: var(--mute); line-height: 1.8; }
  .footer a { color: var(--chrome); text-decoration: none; border-bottom: 1px solid var(--hairline-strong); }
  .footer .wordmark { font-size: 16px; }

  @media (max-width: 380px) {
    .strip-val { font-size: 18px; }
    .pkg-name { font-size: 22px; }
    .price { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="bubbles" aria-hidden="true">
  <span style="width:46px;height:46px;left:6%;top:14%;"></span>
  <span style="width:18px;height:18px;left:86%;top:9%;animation-delay:-4s;"></span>
  <span style="width:30px;height:30px;left:78%;top:46%;animation-delay:-9s;"></span>
  <span style="width:12px;height:12px;left:12%;top:62%;animation-delay:-2s;"></span>
  <span style="width:56px;height:56px;left:88%;top:84%;animation-delay:-12s;"></span>
  <span style="width:22px;height:22px;left:4%;top:90%;animation-delay:-6s;"></span>
</div>

<div class="page">
  <header class="top">
    <a class="logo" id="logo" href="#" aria-label="LUX·O·PLUS">
      <span id="emblem"></span>
      <span>
        <span class="wordmark">LUX<span class="dot"></span>O<span class="dot"></span>PLUS</span>
        <span class="tagline" data-i18n="tagline"></span>
      </span>
    </a>
    <div class="top-right">
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <section class="strip glass" aria-live="polite">
    <div>
      <div class="label" style="display:flex;align-items:center;gap:7px;"><span class="live-dot off" id="live-dot"></span><span data-i18n="inService"></span></div>
      <div class="strip-val glow" id="s-serving">—</div>
    </div>
    <div>
      <div class="label" data-i18n="waiting"></div>
      <div class="strip-val" id="s-waiting">—</div>
    </div>
    <div>
      <div class="label" data-i18n="wait"></div>
      <div class="strip-val" id="s-wait">—</div>
    </div>
  </section>

  <div class="msg msg-warn" id="notice" role="status" hidden style="margin-bottom:16px;"></div>
  <div class="msg msg-error" id="offline" role="alert" hidden style="margin-bottom:16px;" data-i18n="offline"></div>

  <!-- INSCRIPTION -->
  <main id="view-register" hidden>
    <div class="hero">
      <h1 class="display" data-i18n-html="heroTitle"></h1>
      <p class="serif-note" data-i18n="heroSub"></p>
    </div>

    <div class="find-box glass" id="find-box">
      <button type="button" class="find-toggle" id="find-toggle" aria-expanded="false" aria-controls="find-form">
        <span data-i18n="findToggle"></span><span aria-hidden="true">→</span>
      </button>
      <form id="find-form" hidden novalidate>
        <p class="serif-note" data-i18n="findHelp"></p>
        <div class="field">
          <label class="label" for="f-find-phone" data-i18n="findPhone"></label>
          <input class="input" id="f-find-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="438-555-0123" required />
        </div>
        <div class="field">
          <label class="label" for="f-find-num" data-i18n="findNum"></label>
          <input class="input" id="f-find-num" inputmode="numeric" maxlength="4" placeholder="12" />
        </div>
        <button class="btn btn-primary btn-block" id="btn-find" type="submit" data-i18n="findBtn"></button>
        <div class="msg msg-error" id="find-error" role="alert" hidden style="margin-top:12px;"></div>
      </form>
    </div>

    <div class="glass" id="closed-card" hidden style="padding:28px 22px;text-align:center;">
      <div class="eyebrow" data-i18n="closedEyebrow"></div>
      <h2 class="display" style="font-size:30px;margin:10px 0 8px;" data-i18n-html="closedTitle"></h2>
      <p class="serif-note" id="closed-msg"></p>
    </div>

    <form id="register-form" novalidate>
      <div class="step"><span class="label">01</span><h2 data-i18n="stepVehicle"></h2></div>
      <div class="sizes" id="sizes" role="radiogroup"></div>
      <div class="field">
        <label class="label" for="f-car" data-i18n="carLabel"></label>
        <input class="input" id="f-car" maxlength="80" autocomplete="off" required />
      </div>
      <div class="field">
        <label class="label" for="f-color" data-i18n="colorLabel"></label>
        <input class="input" id="f-color" maxlength="40" autocomplete="off" />
      </div>

      <div class="step"><span class="label">02</span><h2 data-i18n="stepPackage"></h2></div>
      <div class="pkgs" id="pkgs" role="radiogroup"></div>
      <div class="msg msg-warn" id="late-msg" role="status" hidden style="margin-top:12px;"></div>

      <div class="step"><span class="label">03</span><h2 data-i18n="stepYou"></h2></div>
      <div class="field">
        <label class="label" for="f-name" data-i18n="nameLabel"></label>
        <input class="input" id="f-name" autocomplete="name" maxlength="80" required />
      </div>
      <div class="field">
        <label class="label" for="f-phone" data-i18n="phoneLabel"></label>
        <input class="input" id="f-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="438-555-0123" required />
      </div>

      <div class="summary glass" id="summary" hidden aria-live="polite">
        <div class="label" data-i18n="recap"></div>
        <dl class="recap" id="recap"></dl>
        <div class="sum-pricing" id="sum-pricing" hidden>
        <div class="summary-total">
          <div class="label" data-i18n="total"></div>
          <div>
            <div class="price" id="sum-price"></div>
            <div class="plus-tax" data-i18n="plusTax"></div>
          </div>
        </div>
        <div class="summary-meta">
          <div><span class="label" data-i18n="carsAhead"></span><strong id="sum-ahead">—</strong></div>
          <div><span class="label" data-i18n="waitBefore"></span><strong id="sum-start">—</strong><small id="sum-start-at"></small></div>
          <div><span class="label" data-i18n="duration"></span><strong id="sum-duration">—</strong></div>
          <div><span class="label" data-i18n="readyAt"></span><strong id="sum-ready">—</strong></div>
        </div>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btn-reg" type="submit"></button>
      <div class="msg msg-info missing" id="missing" hidden></div>
      <p class="serif-note pay-note" data-i18n="payNote"></p>
      <div class="msg msg-error" id="form-error" role="alert" hidden style="margin-top:12px;"></div>
    </form>
  </main>

  <!-- BILLET -->
  <main id="view-ticket" hidden>
    <div class="notif-prompt glass" id="notif-prompt" hidden>
      <span style="flex:1;" data-i18n="notifAsk"></span>
      <button class="btn btn-primary" id="btn-notif" type="button" data-i18n="notifBtn"></button>
    </div>

    <div class="ticket glass">
      <div class="ticket-top">
        <div class="eyebrow" data-i18n="yourNumber"></div>
        <div class="ticket-num" id="t-num">—</div>
        <div class="ticket-name" id="t-name"></div>
        <div class="chips" id="t-chips"></div>
      </div>
      <div class="ticket-body">
        <div class="time-card" id="t-time-card">
          <div class="label" data-i18n="youHave"></div>
          <div class="big" id="t-time-big">—</div>
          <p id="t-time-sub"></p>
        </div>
        <div class="updated"><span id="t-updated"></span> · <button type="button" class="link-btn" id="btn-refresh-eta" data-i18n="refreshNow"></button></div>
        <div class="row"><span class="label" data-i18n="inService"></span><span class="row-val big" id="t-serving">—</span></div>
        <div class="row"><span class="label" data-i18n="carsAhead"></span><span class="row-val" id="t-ahead">—</span></div>
        <div class="row"><span class="label" data-i18n="startsIn"></span><span class="row-val" id="t-eta" style="color:var(--ok);">—</span></div>
        <div class="row"><span class="label" data-i18n="duration"></span><span class="row-val" id="t-duration">—</span></div>
        <div class="row"><span class="label" data-i18n="readyAt"></span><span class="row-val" id="t-ready">—</span></div>
        <div class="row"><span class="label" data-i18n="price"></span><span class="row-val" id="t-price">—</span></div>
        <div class="progress">
          <div class="bar"><div class="bar-fill" id="t-progress"></div></div>
          <div class="bar-labels"><span class="label" data-i18n="registered"></span><span class="label" id="t-pct">0%</span><span class="label" data-i18n="yourTurn"></span></div>
        </div>
        <div class="msg msg-warn" id="t-alert" hidden style="margin-top:14px;"></div>
      </div>
    </div>
    <div class="save-link glass">
      <div class="label" data-i18n="saveTitle"></div>
      <p data-i18n="saveHelp"></p>
      <button class="btn btn-ghost btn-block" id="btn-share" type="button" data-i18n="shareBtn"></button>
    </div>
    <button class="btn btn-danger btn-block" id="btn-leave" type="button" data-i18n="leave"></button>
    <p class="serif-note" style="text-align:center;font-size:13px;margin-top:14px;" data-i18n="keepOpen"></p>
  </main>

  <!-- C'EST VOTRE TOUR -->
  <main id="view-turn" hidden>
    <div class="big-card glass turn-card">
      <div class="eyebrow" id="turn-num"></div>
      <h1 class="display" data-i18n-html="turnTitle"></h1>
      <p class="serif-note" data-i18n="turnSub"></p>
      <div class="bay" id="turn-bay" hidden><span class="label" data-i18n="bay"></span><strong id="turn-bay-num"></strong></div>
    </div>
  </main>

  <!-- TERMINÉ -->
  <main id="view-done" hidden>
    <div class="big-card glass">
      <div class="eyebrow" data-i18n="doneEyebrow"></div>
      <h1 class="display" data-i18n-html="doneTitle"></h1>
      <p class="serif-note" data-i18n="doneSub"></p>
    </div>

function adoptHashTicket() {
  const m = location.hash.match(/t=([0-9a-f-]{36})/i);
  if (!m) return false;
  if (!ticket || ticket.token !== m[1]) {
    ticket = { token: m[1], num: null, alerted: false, turnNotified: false };
    ticketData = undefined; shown = null;
  }
  saveTicket(ticket);
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}

// ---------- Son, vibration, notifications ----------
let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch {}
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
function playSound(type) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    const t0 = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const notes = type === 'turn' ? [523, 659, 784] : [880, 660];
    notes.forEach((f, i) => o.frequency.setValueAtTime(f, t0 + i * 0.15));
    const len = type === 'turn' ? 0.7 : 0.4;
    g.gain.setValueAtTime(0.3, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + len);
    o.start(t0); o.stop(t0 + len);
  } catch {}
}
const canNotify = 'Notification' in window;   // absent sur iPhone hors PWA
function notify(title, body, vibration = 200) {
  try { navigator.vibrate?.(vibration); } catch {}
  if (!canNotify || Notification.permission !== 'granted') return;
  try { new Notification(title, { body, tag: 'luxoplus-queue' }); } catch {}
}
$('btn-notif').addEventListener('click', async () => {
  unlockAudio();
  $('notif-prompt').hidden = true;
  if (!canNotify) return;
  try {
    if (await Notification.requestPermission() === 'granted') notify(t('notifOn'), t('notifOnBody'));
  } catch {}
});

  const services = status.services;

    $('pkgs').innerHTML = services.map((s) => {
      const txt = C.services[s.code] || { name: s.code, tag: {}, features: {} };

      const disabled = !s.fits_today;
      const badge = disabled ? `<span class="badge late">${t('tooLate')}</span>`
        : txt.featured ? `<span class="badge">${t('popular')}</span>` : '';
      return `

}

// « demain » / « lundi » + heure d'ouverture du prochain jour ouvert
function nextOpening() {
  const days = status?.open_days || [];
  const now = new Date();
  for (let i = 1; i <= 7; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    const iso = ((d.getDay() + 6) % 7) + 1;
    if (days.includes(iso)) {
      return { when: i === 1 ? t('tomorrow') : t('onDay', { day: T[lang].days[iso] }), open: fmtHour(status.open_time) };
    }
  }
  return { when: t('tomorrow'), open: fmtHour(status?.open_time || '08:00') };
}
const fmtHour = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  if (lang === 'en') return `${h % 12 || 12}${m ? ':' + String(m).padStart(2, '0') : ''} ${h >= 12 ? 'pm' : 'am'}`;
  return m ? `${h} h ${String(m).padStart(2, '0')}` : `${h} h`;
};

function renderLate() {
  const late = (status?.services || []).filter((x) => !x.fits_today);
  const box = $('late-msg');
  box.hidden = !status?.is_open || late.length === 0;
  if (box.hidden) return;
  const { when, open } = nextOpening();
  const close = fmtHour(status.close_time);
  box.textContent = late.length === status.services.length
    ? t('lateAll', { close, when, open })

      list: late.map((x) => (C.services[x.code]?.name || x.code).replace(/\.$/, '')).join(lang === 'en' ? ' and ' : ' et '),

}

  const name = $('f-name').value.trim();
  const phone = $('f-phone').value.trim();
  const vehicle = [selSize ? C.sizes[selSize][lang] : '', car, $('f-color').value.trim()].filter(Boolean).join(' · ');
  const rows = [
    [t('rPackage'), s ? C.services[s.code]?.name || s.code : ''],
    [t('rVehicle'), vehicle],
    [t('rName'), name],
    [t('rPhone'), phone],
  ].filter(([, v]) => v);
  $('recap').innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  $('summary').hidden = rows.length === 0;

  const priced = !!(s && selSize);
  $('sum-pricing').hidden = !priced;
  if (priced) {
    const wait = status.wait_minutes;
    $('sum-price').innerHTML = priceHtml(s.prices[selSize]);
    $('sum-ahead').textContent = status.waiting_count === 0 ? t('noWait') : carsTxt(status.waiting_count);
    $('sum-start').textContent = wait ? '~' + fmtDuration(wait) : t('now');
    $('sum-start-at').textContent = wait ? t('at', { h: fmtClock(wait, lang) }) : '';
    $('sum-duration').textContent = '~' + fmtDuration(s.minutes, lang);
    $('sum-ready').textContent = fmtClock(wait + s.minutes, lang);
  }

  renderLate();
  const missing = missingFields();
  const noneFits = !(status.services || []).some((x) => x.fits_today);
  $('btn-reg').disabled = missing.length > 0 || noneFits;
  $('missing').hidden = missing.length === 0;
  $('missing').textContent = t('missing', { list: missing.join(', ') });
}
['f-car', 'f-color', 'f-name', 'f-phone'].forEach((id) => $(id).addEventListener('input', renderSummary));

$('pkgs').addEventListener('change', (e) => { if (e.target.name === 'pkg') { selService = e.target.value; renderPackages(); } });
$('sizes').addEventListener('change', (e) => { if (e.target.name === 'size') { selSize = e.target.value; renderPackages(); } });

function clearTicket(key) {
  ticket = null; ticketData = undefined; shown = null;
  saveTicket(null);
  showNotice(key);
  showView('register');
}

function renderTicket() {
  const d = ticketData;
  if (!ticket || d === undefined) return;
  if (d === null) return clearTicket('noTicket');
  if (!d.is_today && d.status !== 'done') return clearTicket('expired');
  if (d.status === 'cancelled') {
    return clearTicket(d.cancelled_by === 'staff' ? 'cancelledStaff' : d.cancelled_by === 'system' ? 'cancelledSystem' : null);
  }
  if (d.status === 'done') {
    if (!d.is_today) return clearTicket(null);
    return showView('done');
  }
  if (d.status === 'serving') {
    $('turn-num').textContent = `— #${d.num} —`;
    $('turn-bay').hidden = !d.bay;
    $('turn-bay-num').textContent = d.bay || '';
    showView('turn');
    if (!ticket.turnNotified) {
      ticket.turnNotified = true; saveTicket(ticket);
      playSound('turn');
      notify(t('notifTurn'), t('notifTurnBody', { bay: d.bay ? ` — ${t('bay').toLowerCase()} ${d.bay}` : '' }), [300, 100, 300]);
    }
    return;
  }

  // En attente — les infos affichées sont rafraîchies aux 5 min (ou au rechargement / bouton Actualiser).
  // Les changements d'état (votre tour, annulation) restent instantanés.
  showView('ticket');
  if (!shown || shown.num !== d.num || forceEta || Date.now() - shownAt >= ETA_REFRESH_MS) {
    shown = d; shownAt = Date.now(); forceEta = false;
  }
  renderTicketDetails(shown);

  const near = d.eta_minutes <= C.alertMinutes;
  if (near && !ticket.alerted) {
    ticket.alerted = true; saveTicket(ticket);
    shown = d; shownAt = Date.now(); renderTicketDetails(d);   // à l'approche du tour, on montre les chiffres à jour
    playSound('warn');
    notify(t('notifSoon'), $('t-alert').textContent);
  }
}

function renderTicketDetails(d) {
  const svc = C.services[d.service_code];
  $('t-num').textContent = '#' + d.num;
  $('t-name').textContent = d.name;
  $('t-chips').innerHTML = [svc?.name || d.service_code, C.sizes[d.vehicle_size]?.[lang], d.color, fmtPrice(d.price, lang) + (lang === 'en' ? ' + tax' : ' + tx')].filter(Boolean)
    .map((c) => `<span class="chip">${esc(c)}</span>`).join('');
  $('t-serving').textContent = servingTxt(d.serving_nums);
  $('t-ahead').textContent = d.ahead === 0 ? '0' : carsTxt(d.ahead);
  $('t-eta').textContent = d.eta_minutes === 0 ? t('next') : `~${fmtDuration(d.eta_minutes)} · ${fmtClock(d.eta_minutes, lang)}`;
  $('t-duration').textContent = '~' + fmtDuration(d.minutes, lang);
  $('t-ready').textContent = fmtClock(d.eta_minutes + d.minutes, lang);
  $('t-price').textContent = t('priceTax', { p: fmtPrice(d.price, lang) });
  $('t-updated').textContent = t('updatedAt', { h: clockNow(new Date(shownAt)) });
  $('t-time-big').textContent = d.eta_minutes === 0 ? t('now') : fmtDuration(d.eta_minutes);
  $('t-time-sub').innerHTML = d.eta_minutes === 0 ? t('timeSubZero') : t('timeSub', {
    cars: d.ahead === 0 ? '0' : carsTxt(d.ahead), start: fmtClock(d.eta_minutes, lang), alert: C.alertMinutes,
  });
  const pct = Math.round(((d.passed) / (d.passed + d.ahead + 1)) * 100);
  $('t-progress').style.width = Math.max(4, pct) + '%';
  $('t-pct').textContent = pct + '%';

  const near = d.eta_minutes <= C.alertMinutes;
  $('t-alert').hidden = !near;
  $('t-alert').textContent = d.eta_minutes === 0 ? t('alertNext') : t('alertSoon', { t: fmtDuration(d.eta_minutes) });
}

function renderAll() {
  renderStatus();
  if (ticket) renderTicket();
  else if ($('view-done').hidden) showView('register');
  renderPackages();
  if (noticeKey) showNotice(noticeKey);
}

// ---------- Données ----------
let loading = false;
async function refresh() {
  if (loading) return;
  loading = true;
  try {
    const calls = [sb.rpc('get_queue_status')];
    const tokenAtCall = ticket?.token;
    if (tokenAtCall) calls.push(sb.rpc('get_ticket', { p_token: tokenAtCall }));
    const [st, tk] = await Promise.all(calls);
    if (st.error) throw st.error;
    status = st.data;
    if (tokenAtCall && ticket?.token === tokenAtCall) {
      if (tk.error) throw tk.error;
      ticketData = tk.data ?? null;
    }
    renderAll();
    setLive(true);
  } catch (e) {
    console.error(e);
    setLive(false);
  } finally {
    loading = false;
  }
}

$('register-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  unlockAudio();
  const name = $('f-name').value.trim();
  const car = $('f-car').value.trim();
  const phone = $('f-phone').value.trim();
  const err = $('form-error');
  const fail = (code, field) => { err.textContent = T[lang].err[code]; err.hidden = false; field?.focus(); };
  err.hidden = true;
  if (!selService) return fail('FORFAIT_INVALIDE');
  if (!selSize) return fail('TAILLE_INVALIDE');
  $('f-car').classList.toggle('invalid', car.length < 2);
  if (car.length < 2) return fail('VEHICULE_REQUIS', $('f-car'));
  $('f-name').classList.toggle('invalid', name.length < 2);
  if (name.length < 2) return fail('NOM_INVALIDE', $('f-name'));
  const digits = phoneDigits(phone);
  $('f-phone').classList.toggle('invalid', digits.length !== 10);
  if (!digits) return fail('TELEPHONE_REQUIS', $('f-phone'));
  if (digits.length !== 10) return fail('TELEPHONE_INVALIDE', $('f-phone'));

  const btn = $('btn-reg');
  btn.disabled = true; btn.textContent = t('joining');
  try {
    const { data, error } = await sb.rpc('join_queue', {
      p_name: name, p_car: car, p_color: $('f-color').value.trim(), p_service: selService, p_size: selSize, p_phone: phone, p_lang: lang,
    });
    if (error) throw error;
    ticket = { token: data.token, num: data.num, alerted: false, turnNotified: false };
    ticketData = undefined;
    saveTicket(ticket);
    showNotice(null);
    $('register-form').reset();
    selService = null; selSize = null; pkgKey = null;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    await refresh();
    if (canNotify && Notification.permission === 'default') $('notif-prompt').hidden = false;
  } catch (e) {
    err.textContent = errorText(e);
    err.hidden = false;
    if ((e?.message || '').includes('DEJA_INSCRIT')) openFind(phone);
    pkgKey = null; refresh();   // ex. TROP_TARD : rafraîchir les forfaits disponibles
  } finally {
    btn.textContent = t('join');
    renderSummary();
  }
});

// ---------- Retrouver ma place ----------
function openFind(phone = '') {
  $('find-form').hidden = false;
  $('find-toggle').setAttribute('aria-expanded', 'true');
  if (phone) $('f-find-phone').value = phone;
  $('find-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('f-find-phone').focus({ preventScroll: true });
}
$('find-toggle').addEventListener('click', () => {
  const open = $('find-form').hidden;
  $('find-form').hidden = !open;
  $('find-toggle').setAttribute('aria-expanded', String(open));
  if (open) $('f-find-phone').focus();
});
$('find-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const err = $('find-error');
  err.hidden = true;
  const phone = $('f-find-phone').value.trim();
  const numTxt = $('f-find-num').value.replace(/\D/g, '');
  if (phoneDigits(phone).length !== 10) {
    err.textContent = T[lang].err[phone ? 'TELEPHONE_INVALIDE' : 'TELEPHONE_REQUIS'];
    err.hidden = false;
    return;
  }
  const btn = $('btn-find');
  btn.disabled = true; btn.textContent = t('finding');
  try {
    const { data, error } = await sb.rpc('find_ticket', { p_phone: phone, p_num: numTxt ? Number(numTxt) : null });
    if (error) throw error;
    if (!data) throw new Error('INTROUVABLE');
    ticket = { token: data, num: null, alerted: false, turnNotified: false };
    ticketData = undefined; shown = null;
    saveTicket(ticket);
    $('find-form').reset(); $('find-form').hidden = true;
    $('form-error').hidden = true;
    showNotice('found');
    setTimeout(() => { if (noticeKey === 'found') showNotice(null); }, 6000);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    await refresh();
  } catch (e) {
    err.textContent = errorText(e);
    err.hidden = false;
  } finally {
    btn.disabled = false; btn.textContent = t('findBtn');
  }
});

// ---------- Lien de suivi ----------
$('btn-share').addEventListener('click', async () => {
  if (!ticket) return;
  const url = `${location.origin}${location.pathname}#t=${ticket.token}`;
  const btn = $('btn-share');
  try {
    if (navigator.share) {
      await navigator.share({ title: 'LUX·O·PLUS', text: lang === 'en' ? 'My spot in line' : 'Ma place dans la file', url });
      return;
    }
    await navigator.clipboard.writeText(url);
  } catch (e) {
    if (e?.name === 'AbortError') return;
    window.prompt(t('shareBtn'), url);   // dernier recours : afficher le lien à copier
    return;
  }
  btn.textContent = t('copied');
  setTimeout(() => { btn.textContent = t('shareBtn'); }, 2500);
});
$('btn-refresh-eta').addEventListener('click', () => { forceEta = true; refresh(); });

$('btn-leave').addEventListener('click', async () => {
  if (!ticket || !confirm(t('leaveConfirm'))) return;
  const btn = $('btn-leave');
  btn.disabled = true;
  try {
    const { error } = await sb.rpc('leave_queue', { p_token: ticket.token });
    if (error) throw error;
    clearTicket(null);
    await refresh();
  } catch (e) {
    alert(errorText(e));
  } finally {
    btn.disabled = false;
  }
});

$('btn-new').addEventListener('click', () => { clearTicket(null); refresh(); });

document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('online', refresh);
applyLang();
refresh();
setInterval(refresh, POLL_MS);
</script>
