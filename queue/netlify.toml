# Seuls les fichiers de l'app sont publiés (pas dev/ ni supabase/).
[build]
  command = "rm -rf dist && mkdir dist && cp index.html admin.html tv.html brand.css config.js demo-backend.js qr.js dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
